<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alkemy Project Manager</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
        }

        /* ==================== WELCOME SCREEN ==================== */
        .welcome-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .welcome-box {
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .welcome-box h1 {
            color: #e94560;
            font-size: 32px;
            margin-bottom: 10px;
        }
        .welcome-box .subtitle {
            color: #888;
            margin-bottom: 30px;
        }
        .welcome-box input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            background: rgba(255,255,255,0.1);
            color: white;
        }
        .welcome-box input::placeholder { color: #666; }
        .welcome-box input:focus { outline: 2px solid #e94560; }
        .btn-start {
            width: 100%;
            padding: 15px;
            background: linear-gradient(145deg, #e94560, #c73e54);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }
        .btn-start:hover { transform: scale(1.02); }
        .btn-start:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-leaderboard {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: #f1c40f;
            border: 2px solid #f1c40f;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 15px;
        }

        /* ==================== LEADERBOARD ==================== */
        .leaderboard-section {
            margin-top: 30px;
            text-align: left;
        }
        .leaderboard-section h3 {
            color: #f1c40f;
            margin-bottom: 15px;
            text-align: center;
        }
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .leaderboard-table th {
            background: rgba(241, 196, 15, 0.2);
            padding: 10px 5px;
            text-align: left;
            color: #f1c40f;
        }
        .leaderboard-table td {
            padding: 8px 5px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .leaderboard-table tr:hover { background: rgba(255,255,255,0.05); }
        .no-data { color: #666; text-align: center; padding: 20px; }

        /* ==================== GAME SCREEN - COMPACT LAYOUT ==================== */
        .game-screen { display: none; padding: 8px; }
        .container { max-width: 1100px; margin: 0 auto; }

        /* Header Row */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .project-num { font-size: 16px; font-weight: bold; color: #e94560; }
        .phase-badge { padding: 4px 12px; border-radius: 12px; font-weight: bold; font-size: 11px; }
        .phase-staffing { background: #3498db; }
        .phase-delivery { background: #e67e22; }
        .budget-display {
            font-size: 24px;
            font-weight: bold;
            color: #2ecc71;
            background: rgba(46, 204, 113, 0.15);
            padding: 8px 16px;
            border-radius: 10px;
            border: 2px solid #2ecc71;
            text-shadow: 0 0 10px rgba(46, 204, 113, 0.5);
        }
        .btn-menu { background: #34495e; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }

        /* Top Row: Project + Client */
        .top-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .card-box {
            background: rgba(0,0,0,0.4);
            border-radius: 10px;
            padding: 8px;
        }
        .box-title { font-size: 11px; font-weight: bold; margin-bottom: 6px; text-align: center; }
        .project-box .box-title { color: #3498db; }
        .client-box .box-title { color: #e74c3c; }

        /* Mini Project/Client Cards */
        .mini-card {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            min-height: 80px;
        }
        .mini-card .name { font-size: 12px; font-weight: bold; color: #fff; margin-bottom: 4px; }
        .mini-card .desc { font-size: 9px; color: #aaa; margin-bottom: 4px; }
        .mini-card .perf { font-size: 20px; font-weight: bold; color: #f1c40f; }
        .mini-card .details { font-size: 9px; color: #888; margin-top: 4px; }
        .mini-card .synergy { font-size: 9px; color: #1abc9c; }
        .mini-card .client-effect { font-size: 9px; color: #e67e22; }
        .mini-card .multiplier { font-size: 10px; color: #f1c40f; }
        .mini-card.hidden .perf { color: #666; }

        /* HR Panel */
        .hr-panel {
            background: rgba(0,0,0,0.4);
            border-radius: 10px;
            padding: 8px;
            margin-bottom: 8px;
        }
        .hr-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .hr-title { font-size: 12px; font-weight: bold; color: #9b59b6; }
        .hr-buttons { display: flex; gap: 4px; }
        .btn-hr { padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 10px; font-weight: bold; }
        .btn-hr:first-child { background: #3498db; color: white; }
        .btn-hr:last-child { background: #1abc9c; color: white; }
        .btn-hr.frozen { background: #e74c3c; }
        .btn-hr:disabled { opacity: 0.5; }
        .hr-cards { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }

        /* Performance Summary */
        .performance-summary {
            display: flex;
            justify-content: center;
            gap: 15px;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 8px;
        }
        .perf-item { text-align: center; }
        .perf-item .value { font-size: 20px; font-weight: bold; }
        .perf-item .label { font-size: 9px; color: #888; }
        .perf-item.leader .value { color: #f1c40f; }
        .perf-item.total .value { color: #2ecc71; }
        .perf-item.required .value { color: #e74c3c; }

        /* Middle Row: Leader + Team */
        .middle-row {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .section-box {
            background: rgba(0,0,0,0.4);
            border-radius: 10px;
            padding: 8px;
        }
        .section-title { font-size: 11px; font-weight: bold; margin-bottom: 6px; }
        .leader-box .section-title { color: #f1c40f; }
        .team-box .section-title { color: #3498db; }
        .pool-box .section-title { color: #9b59b6; }
        .cards-row { display: flex; gap: 6px; flex-wrap: wrap; min-height: 90px; align-items: center; }
        .leader-box .cards-row { justify-content: center; }

        /* Actions */
        .actions-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .btn-action {
            padding: 8px 16px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-action:disabled { opacity: 0.5; }
        .btn-delivery { background: linear-gradient(145deg, #e67e22, #d35400); color: white; }
        .btn-calculate { background: linear-gradient(145deg, #27ae60, #1e8449); color: white; }
        .btn-sell { background: linear-gradient(145deg, #e74c3c, #c0392b); color: white; }

        /* Pool */
        .pool-box { margin-bottom: 8px; }
        .pool-box .cards-row { justify-content: center; }

        /* Bottom Row: Stats + Log */
        .bottom-row {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 8px;
        }
        .session-stats-box {
            background: rgba(0,0,0,0.4);
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .stat-item { display: flex; align-items: center; gap: 6px; font-size: 11px; }
        .stat-label { width: 20px; }
        .stat-value { font-weight: bold; }
        .stat-value.money { color: #2ecc71; }
        .log-box {
            background: rgba(0,0,0,0.4);
            border-radius: 8px;
            padding: 6px;
        }
        .log {
            height: 70px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 9px;
            color: #0f0;
            background: #0a0a0a;
            padding: 4px;
            border-radius: 4px;
        }
        .log .win { color: #f1c40f; }
        .log .lose { color: #e74c3c; }
        .log .info { color: #3498db; }
        .log .money { color: #2ecc71; }

        /* Card Style */
        .card {
            width: 75px;
            height: 100px;
            border-radius: 8px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            text-align: center;
        }
        .card:hover { transform: translateY(-3px) scale(1.02); }
        .card.leader { border: 2px solid #f1c40f; }
        .card.leader::after { content: '👑'; position: absolute; top: -10px; right: -6px; font-size: 14px; }
        .card-name { font-size: 8px; font-weight: bold; margin-bottom: 2px; min-height: 18px; display: flex; align-items: center; justify-content: center; }
        .card-role { font-size: 7px; opacity: 0.8; margin-bottom: 2px; }
        .card-performance { font-size: 20px; font-weight: bold; color: #f1c40f; flex-grow: 1; display: flex; align-items: center; justify-content: center; }
        .card-performance span { font-size: 8px; margin-left: 2px; }
        .card-cost { font-size: 12px; color: #2ecc71; font-weight: bold; }
        .empty-slot {
            width: 75px;
            height: 100px;
            border: 2px dashed #444;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 9px;
            text-align: center;
        }
        .empty-slot.leader-slot { border-color: #f1c40f; color: #f1c40f; background: rgba(241,196,15,0.1); }
        .empty-slot.required { border-color: #e74c3c;
            color: #e74c3c;
        }

        /* Tribe Colors - 6 Competence Centers + Neutral for Legends */
        .tribe-CONSULTING { background: linear-gradient(145deg, #3498db, #2980b9); }
        .tribe-DATA_ANALYTICS { background: linear-gradient(145deg, #f1c40f, #d4ac0d); color: #000; }
        .tribe-MARKETING_MEDIA { background: linear-gradient(145deg, #e67e22, #d35400); }
        .tribe-BRAND_EXPERIENCE { background: linear-gradient(145deg, #e74c3c, #c0392b); }
        .tribe-TECH { background: linear-gradient(145deg, #9b59b6, #8e44ad); }
        .tribe-GO_TO_MARKET { background: linear-gradient(145deg, #1abc9c, #16a085); }
        .tribe-NEUTRAL { background: linear-gradient(145deg, #7f8c8d, #95a5a6); }

        /* Legendary Card Styling */
        .card.legendary {
            border: 3px solid #ff6b6b;
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
            animation: legendaryGlow 2s ease-in-out infinite alternate;
        }
        @keyframes legendaryGlow {
            from { box-shadow: 0 0 15px rgba(255, 107, 107, 0.4); }
            to { box-shadow: 0 0 25px rgba(255, 107, 107, 0.8); }
        }
        .card .ability-icon {
            position: absolute;
            bottom: 2px;
            right: 2px;
            font-size: 12px;
        }
        .card-ability {
            font-size: 7px;
            color: rgba(255,255,255,0.8);
            margin-top: 2px;
            line-height: 1.2;
            max-height: 24px;
            overflow: hidden;
        }

        /* Card Hover Preview Overlay */
        .card-preview-overlay {
            position: fixed;
            z-index: 2000;
            pointer-events: none;
            padding: 15px;
            background: rgba(0, 0, 0, 0.95);
            border-radius: 15px;
            border: 2px solid #f1c40f;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            min-width: 180px;
            text-align: center;
            display: none;
        }
        .card-preview-overlay.visible { display: block; }
        .card-preview-overlay .preview-name {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
        }
        .card-preview-overlay .preview-tribe {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 8px;
        }
        .card-preview-overlay .preview-perf {
            font-size: 36px;
            font-weight: bold;
            color: #f1c40f;
            margin: 10px 0;
        }
        .card-preview-overlay .preview-ability {
            font-size: 12px;
            color: #3498db;
            margin-top: 8px;
            padding: 8px;
            background: rgba(52, 152, 219, 0.2);
            border-radius: 8px;
        }
        .card-preview-overlay .preview-cost {
            font-size: 14px;
            color: #2ecc71;
            margin-top: 8px;
            font-weight: bold;
        }
        .card-preview-overlay .preview-tier {
            font-size: 10px;
            color: #9b59b6;
            margin-top: 5px;
        }
        .card-preview-overlay.legendary {
            border-color: #ff6b6b;
            box-shadow: 0 10px 40px rgba(255, 107, 107, 0.4);
        }

        /* Client Card */
        .client-card {
            width: 220px;
            min-height: 180px;
            background: linear-gradient(145deg, #2c3e50, #34495e);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        .client-card.hidden {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
        }
        .client-card .client-name {
            font-size: 16px;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 8px;
        }
        .client-card .client-desc {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 10px;
        }
        .client-card .required-performance {
            font-size: 32px;
            font-weight: bold;
            color: #e74c3c;
        }
        .client-card .client-details {
            font-size: 11px;
            color: #888;
            margin-top: 10px;
        }
        .client-card .ticket-info {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 11px;
        }
        .client-card .ticket-info .reward {
            color: #2ecc71;
            font-weight: bold;
            font-size: 14px;
        }

        /* Action Buttons */
        .actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            flex-wrap: wrap;
        }
        .btn-action {
            padding: 12px 30px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-action:hover:not(:disabled) { transform: scale(1.05); }
        .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-delivery { background: linear-gradient(145deg, #e67e22, #d35400); color: white; }
        .btn-calculate { background: linear-gradient(145deg, #27ae60, #1e8449); color: white; }
        .btn-sell { background: linear-gradient(145deg, #e74c3c, #c0392b); color: white; font-size: 12px; padding: 8px 15px; }
        .btn-menu { background: #34495e; color: white; font-size: 12px; padding: 8px 15px; }

        /* Performance Summary */
        .performance-summary {
            background: rgba(0,0,0,0.6);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        .performance-summary h3 { color: #f1c40f; margin-bottom: 12px; font-size: 14px; }
        .performance-breakdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .perf-item { text-align: center; }
        .perf-item .value { font-size: 28px; font-weight: bold; }
        .perf-item .label { font-size: 10px; color: #aaa; }
        .perf-item.total .value { color: #2ecc71; }
        .perf-item.required .value { color: #e74c3c; }
        .perf-item.leader .value { color: #f1c40f; }

        /* Log */
        .log-section {
            background: rgba(0,0,0,0.5);
            border-radius: 12px;
            padding: 10px;
            margin-top: 15px;
        }
        .log-section h3 { margin-bottom: 6px; color: #f39c12; font-size: 12px; }
        .log {
            height: 100px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            font-size: 10px;
            color: #0f0;
            background: #0a0a0a;
            padding: 8px;
            border-radius: 8px;
        }
        .log .win { color: #f1c40f; font-weight: bold; }
        .log .lose { color: #e74c3c; }
        .log .info { color: #3498db; }
        .log .money { color: #2ecc71; }

        /* Result Overlay */
        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .overlay-content {
            text-align: center;
            padding: 40px;
            background: linear-gradient(145deg, #16213e, #1a1a2e);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            max-width: 450px;
        }
        .overlay h1 { font-size: 36px; margin-bottom: 15px; }
        .overlay.victory h1 { color: #f1c40f; text-shadow: 0 0 30px rgba(241, 196, 15, 0.5); }
        .overlay.defeat h1 { color: #e74c3c; text-shadow: 0 0 30px rgba(231, 76, 60, 0.5); }
        .overlay p { margin-bottom: 15px; font-size: 16px; color: #aaa; }
        .overlay .stats-display {
            margin: 15px 0;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            font-size: 14px;
        }
        .overlay .reward-display {
            color: #2ecc71;
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
        }
        .overlay button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 5px;
        }
        .btn-next { background: linear-gradient(145deg, #27ae60, #1e8449); color: white; }
        .btn-restart { background: linear-gradient(145deg, #3498db, #2980b9); color: white; }

        /* Session Stats Bar */
        .session-stats {
            background: rgba(0,0,0,0.3);
            padding: 8px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 12px;
        }
        .session-stat { text-align: center; }
        .session-stat .value { font-weight: bold; font-size: 16px; }
        .session-stat .label { color: #888; font-size: 10px; }
        .session-stat.money .value { color: #2ecc71; }
        .session-stat.perf .value { color: #f1c40f; }
        .session-stat.projects .value { color: #3498db; }
    </style>
</head>
<body>
    <!-- ==================== WELCOME SCREEN ==================== -->
    <div class="welcome-screen" id="welcome-screen">
        <div class="welcome-box">
            <h1>Alkemy Project Manager</h1>
            <p class="subtitle">Gestisci progetti, staffa il team, soddisfa i clienti!</p>

            <input type="text" id="input-nome" placeholder="Nome" maxlength="30">
            <input type="text" id="input-cognome" placeholder="Cognome" maxlength="30">

            <button class="btn-start" id="btn-start" onclick="startGame()">
                🎮 INIZIA A GIOCARE
            </button>

            <button class="btn-leaderboard" onclick="toggleLeaderboard()">
                🏆 Mostra Leaderboard
            </button>

            <div class="leaderboard-section" id="leaderboard-section" style="display: none;">
                <h3>🏆 LEADERBOARD</h3>
                <div id="leaderboard-content"></div>
            </div>
        </div>
    </div>

    <!-- ==================== GAME SCREEN ==================== -->
    <div class="game-screen" id="game-screen">
        <div class="container">
            <!-- Header Row -->
            <div class="header-row">
                <div class="header-left">
                    <span class="project-num">📋 #<span id="project-num">1</span></span>
                    <span class="phase-badge phase-staffing" id="phase-badge">STAFFING</span>
                </div>
                <div class="header-center">
                    <span class="budget-display">💶 <span id="budget">0</span> k€</span>
                </div>
                <div class="header-right">
                    <button class="btn-menu" onclick="backToMenu()">🏠</button>
                </div>
            </div>

            <!-- Top Row: Project + Client -->
            <div class="top-row">
                <div class="card-box project-box">
                    <div class="box-title">📋 PROGETTO</div>
                    <div id="project-card-area"></div>
                </div>
                <div class="card-box client-box">
                    <div class="box-title">👤 CLIENTE</div>
                    <div id="client-card-area"></div>
                </div>
            </div>

            <!-- HR Panel -->
            <div class="hr-panel" id="hr-panel">
                <div class="hr-header">
                    <span class="hr-title">👥 HR</span>
                    <div class="hr-buttons">
                        <button class="btn-hr" id="btn-refresh" onclick="refreshHR()">🔄 1k€</button>
                        <button class="btn-hr" id="btn-freeze" onclick="freezeHR()">❄️</button>
                    </div>
                </div>
                <div id="hr-cards" class="hr-cards"></div>
            </div>

            <!-- Performance Summary (delivery only) -->

    // ==================== LEADERBOARD ====================
    function getLeaderboard() {
        const data = localStorage.getItem('alkemy_leaderboard');
        return data ? JSON.parse(data) : [];
    }

    function saveToLeaderboard(entry) {
        const lb = getLeaderboard();
        lb.push(entry);
        lb.sort((a, b) => b.moneyGenerated - a.moneyGenerated);
        localStorage.setItem('alkemy_leaderboard', JSON.stringify(lb.slice(0, 50))); // Keep top 50
    }

    function renderLeaderboard() {
        const lb = getLeaderboard();
        const container = document.getElementById('leaderboard-content');

        if (lb.length === 0) {
            container.innerHTML = '<div class="no-data">Nessuna partita registrata</div>';
            return;
        }

        let html = '<table class="leaderboard-table"><thead><tr>';
        html += '<th>#</th><th>Nome</th><th>Sessione</th><th>€ Generati</th><th>Progetti</th><th>Perf Tot</th>';
        html += '</tr></thead><tbody>';

        lb.slice(0, 20).forEach((entry, i) => {
            html += `<tr>
                <td>${i + 1}</td>
                <td>${entry.name}</td>
                <td>#${entry.sessionNum}</td>
                <td style="color:#2ecc71">${entry.moneyGenerated}k€</td>
                <td>${entry.projectsCompleted}</td>
                <td style="color:#f1c40f">${entry.totalPerformance}⭐</td>
            </tr>`;
        });

        html += '</tbody></table>';
        container.innerHTML = html;
    }

    function toggleLeaderboard() {
        const section = document.getElementById('leaderboard-section');
        if (section.style.display === 'none') {
            section.style.display = 'block';
            renderLeaderboard();
        } else {
            section.style.display = 'none';
        }
    }

    function getNextSessionNum(name) {
        const lb = getLeaderboard();
        const playerSessions = lb.filter(e => e.name === name);
        return playerSessions.length + 1;
    }

            alert('Inserisci nome e cognome!');
            return;

            playerName: fullName,
            sessionNum: sessionNum,
            moneyGenerated: 0,
            projectsCompleted: 0,
            totalPerformance: 0
        };

        document.getElementById('welcome-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';

        initGame();
    }

        generateProject();
        refreshHR();
        log("🎮 Nuova sessione iniziata!", "info");
        log(`👤 Giocatore: ${session.playerName}`, "info");
        log(`📋 Progetto #${game.projectNum}`, "info");
        updateUI();
    }

    function createResource(resourceId) {
        const template = RESOURCES[resourceId];
        return {
            id: Math.random().toString(36).substr(2, 9),
            resourceId,
            name: template.name,
            tribe: template.tribe,
            tier: template.tier,
            performance: template.performance,
            cost: template.cost,
            sellValue: template.sellValue || Math.ceil(template.cost / 2),
            ability: template.ability || null,
            abilityDesc: template.abilityDesc || null
        };
    }

    function generateProject() {
        // Get available projects (not used recently)
        let available = PROJECT_LIST.filter(p => !game.usedProjects.includes(p.id));
        if (available.length === 0) {
            game.usedProjects = [];
            available = PROJECT_LIST;
        }

        // Pick random project
        const project = available[Math.floor(Math.random() * available.length)];
        game.usedProjects.push(project.id);

        // Pick random client
        const client = CLIENT_LIST[Math.floor(Math.random() * CLIENT_LIST.length)];

        // Calculate required performance based on project number and client strength
        const basePerf = client.baseStrength + (game.projectNum * 2);
        const variation = Math.floor(Math.random() * 4) - 2; // -2 to +2

        game.project = {
            ...project,
            requiredPerformance: basePerf + variation,
            revealed: false
        };
        game.client = client;
        game.requiredStaff = project.staffLimit;
    }

    function calculateReward() {
        // Base reward from project × client multiplier
        const baseReward = game.project.reward;
        const scaling = Math.floor(game.projectNum / 3);
        const multiplier = game.client ? game.client.moneyMultiplier : 1;
        return Math.floor((baseReward + scaling) * multiplier);
    }

    function getSynergyBonus(units) {
        if (!game.project || !game.project.synergy) return 0;

        let bonus = 0;
        const synergies = game.project.synergy;

        units.forEach(unit => {
            if (synergies.includes(unit.tribe)) {
                // Check for model_training ability (DATA gets +2 instead of +1)
                if (game.project.ability === 'model_training' && unit.tribe === 'DATA_ANALYTICS') {
                    bonus += 2;
                } else {
                    bonus += 1;
                }
            }
        });

        return bonus;
    }

    // ==================== HR ====================
    function refreshHR() {
        if (game.phase !== 'staffing') return;
        if (game.budget < 1 && !game.hr.frozen) {
            log("❌ Budget insufficiente!", "lose");
            return;
        }

        if (!game.hr.frozen) game.budget--;
        game.hr.frozen = false;
        game.hr.cards = [];

        const availableIds = Object.keys(RESOURCES);
        const maxTier = Math.min(1 + Math.floor(game.projectNum / 2), 5);
        const filtered = availableIds.filter(id => RESOURCES[id].tier <= maxTier);

        for (let i = 0; i < 4; i++) {
            const id = filtered[Math.floor(Math.random() * filtered.length)];
            game.hr.cards.push(createResource(id));
        }

        log("🔄 HR aggiornato");
        updateUI();
    }

    function freezeHR() {
        game.hr.frozen = !game.hr.frozen;
        log(game.hr.frozen ? "❄️ HR congelato" : "🔥 HR scongelato");
        updateUI();
    }

    // ==================== PLAYER ACTIONS ====================
    function hireResource(index) {
        if (game.phase !== 'staffing') return;

        const resource = game.hr.cards[index];
        if (!resource) return;

        if (game.budget < resource.cost) {
            log(`❌ Servono ${resource.cost}k€!`, "lose");
            return;
        }

        if (game.pool.length >= 8) {
            log("❌ Pool pieno!", "lose");
            return;
        }

        game.budget -= resource.cost;
        game.hr.cards.splice(index, 1);
        game.pool.push(resource);
        log(`✅ Assunto ${resource.name} (${resource.performance}⭐)`, "info");
        updateUI();
    }

    function staffFromPool(poolIndex) {
        if (sellMode) { sellResource('pool', poolIndex); return; }
        if (game.phase !== 'staffing') return;

        const resource = game.pool[poolIndex];
        if (!resource) return;

        if (game.team.length >= game.requiredStaff) {
            log("❌ Team completo!", "lose");
            return;
        }

        game.pool.splice(poolIndex, 1);
        game.team.push(resource);
        log(`📌 ${resource.name} nel team`);
        updateUI();
    }

    function setAsLeader(source, index) {
        if (sellMode && source !== 'leader') {
            sellResource(source, index);
            return;
        }
        if (game.phase !== 'staffing') return;

        let resource = null;

        if (source === 'pool') {
            resource = game.pool.splice(index, 1)[0];
        } else if (source === 'team') {
            resource = game.team.splice(index, 1)[0];
        } else if (source === 'leader') {
            // Remove from leader, put back to pool
            if (game.leader) {
                game.pool.push(game.leader);
                log(`↩️ ${game.leader.name} torna nel pool`);
                game.leader = null;
                updateUI();
                return;
            }
        }

        if (!resource) return;

        // If there's already a leader, put them back in pool
        if (game.leader) {
            game.pool.push(game.leader);
            log(`↩️ ${game.leader.name} torna nel pool`);
        }

        game.leader = resource;
        log(`👑 ${resource.name} è il Capo Progetto!`, "info");
        updateUI();
    }

    function unstaffResource(teamIndex) {
        if (sellMode) { sellResource('team', teamIndex); return; }
        if (game.phase !== 'staffing') return;

        const resource = game.team.splice(teamIndex, 1)[0];
        if (resource) {
            game.pool.push(resource);
            log(`↩️ ${resource.name} torna nel pool`);
            updateUI();
        }
    }

    function sellResource(location, index) {
        let list;
        if (location === 'pool') list = game.pool;
        else if (location === 'team') list = game.team;
        else if (location === 'leader' && game.leader) {
            const resource = game.leader;
            game.leader = null;
            const sellValue = resource.sellValue || Math.ceil(resource.cost / 2);
            game.budget += sellValue;
            log(`💸 Venduto ${resource.name} per ${sellValue}k€`, "money");
            sellMode = false;
            updateUI();
            return;
        }
        else return;

        if (index >= list.length) return;

        const resource = list.splice(index, 1)[0];
        const sellValue = resource.sellValue || Math.ceil(resource.cost / 2);
        game.budget += sellValue;
        log(`💸 Venduto ${resource.name} per ${sellValue}k€`, "money");
        sellMode = false;
        updateUI();
    }

    function toggleSellMode() {
        sellMode = !sellMode;
        log(sellMode ? "💸 Clicca una risorsa per venderla" : "Modalità vendita OFF");
        updateUI();
    }

    // ==================== GAME PHASES ====================
    function goToDelivery() {
        // User can go to delivery anytime - no restrictions
        game.phase = 'delivery';
        game.project.revealed = true;
        sellMode = false;

        log("\n📦 === DELIVERY ===", "info");
        log(`📋 ${game.project.name}`, "info");
        log(`👤 Cliente: ${game.client.name}`, "info");
        log(`⚠️ Effetto: ${game.client.effectDesc}`, "lose");
        log(`📊 Performance richiesta: ${game.project.requiredPerformance}⭐`);
        log(`🎯 Abilità progetto: ${game.project.abilityDesc}`);
        log(`✨ Sinergie: ${game.project.synergy.join(', ')}`);
        log(`💰 Reward: ${calculateReward()}k€ (x${game.client.moneyMultiplier})`);

        updateUI();
    }

    function calculatePerformance() {
        if (game.phase !== 'delivery') return;

        // Gather all units (team + leader)
        const allUnits = [...game.team];
        if (game.leader) allUnits.push(game.leader);

        // Find all active unit abilities
        const activeAbilities = allUnits.filter(u => u.ability).map(u => u.ability);

        // Check for ability that ignores all abilities (Enrico Chaos)
        const ignoreAllAbilities = activeAbilities.includes('ignore_abilities');

        // Get project ability
        const projectAbility = game.project.ability;

        let abilityLog = [];

        // Count competence centers for diversity bonuses
        const competenceCenters = new Set(allUnits.map(u => u.tribe));
        const numCCs = competenceCenters.size;

        // Clone units for performance calculation
        let unitPerfs = allUnits.map(u => ({ ...u, calcPerf: u.performance }));

        // ========== CLIENT NEGATIVE EFFECTS (applied first) ==========
        const clientEffect = game.client ? game.client.effect : null;
        let skipSynergyBonus = false;

        if (clientEffect && !ignoreAllAbilities) {
            switch(clientEffect) {
                case 'remove_data': // Concetta Frog: remove 1 random DATA unit
                    const dataUnitsForRemoval = unitPerfs.filter(u => u.tribe === 'DATA_ANALYTICS');
                    if (dataUnitsForRemoval.length > 0) {
                        const toRemove = dataUnitsForRemoval[Math.floor(Math.random() * dataUnitsForRemoval.length)];
                        toRemove.calcPerf = 0;
                        toRemove.removed = true;
                        abilityLog.push(`🐸 ${game.client.name}: ${toRemove.name} rimosso!`);
                    }
                    break;

                case 'disable_ability': // Costantino Finesso: disable 1 non-GTM ability
                    const unitsWithAbility = unitPerfs.filter(u => u.ability && u.tribe !== 'GO_TO_MARKET');
                    if (unitsWithAbility.length > 0) {
                        const target = unitsWithAbility[Math.floor(Math.random() * unitsWithAbility.length)];
                        target.abilityDisabled = true;
                        abilityLog.push(`👔 ${game.client.name}: ${target.name} abilità disabilitata!`);
                    }
                    break;

                case 'random_perf': // Fabio Trentalance: +2 or -2 random to all
                    unitPerfs.forEach(u => {
                        const change = Math.random() < 0.5 ? -2 : 2;
                        u.calcPerf = Math.max(0, u.calcPerf + change);
                        abilityLog.push(`🎰 ${u.name} ${change > 0 ? '+' : ''}${change}`);
                    });
                    break;

                case 'data_zero': // Jonathan Albergo: DATA = 0 performance
                    unitPerfs.forEach(u => {
                        if (u.tribe === 'DATA_ANALYTICS') {
                            u.calcPerf = 0;
                            abilityLog.push(`🏨 ${u.name} = 0 (DATA penalizzato)`);
                        }
                    });
                    break;

                case 'expensive_zero': // Alessandro Marocash: most expensive = 0
                    const sortedByCost = [...unitPerfs].sort((a, b) => b.cost - a.cost);
                    if (sortedByCost.length > 0) {
                        sortedByCost[0].calcPerf = 0;
                        abilityLog.push(`💰 ${sortedByCost[0].name} = 0 (più costoso)`);
                    }
                    break;

                case 'consulting_penalty': // Riccardo Striscia: CONSULTING -1
                    unitPerfs.forEach(u => {
                        if (u.tribe === 'CONSULTING') {
                            u.calcPerf = Math.max(0, u.calcPerf - 1);
                            abilityLog.push(`📉 ${u.name} -1 (Consulting)`);
                        }
                    });
                    break;

                case 'no_synergy': // Flusso Rosso: no synergy bonus
                    skipSynergyBonus = true;
                    abilityLog.push(`🔴 ${game.client.name}: Nessun bonus sinergia!`);
                    break;

                case 'high_tier_penalty': // Stefano Non Ripete: tier 3+ lose 2
                    unitPerfs.forEach(u => {
                        if (u.tier >= 3) {
                            u.calcPerf = Math.max(0, u.calcPerf - 2);
                            abilityLog.push(`⬇️ ${u.name} -2 (tier ${u.tier})`);
                        }
                    });
                    break;
            }
        }

        // ========== PROJECT ABILITIES ==========
        if (!ignoreAllAbilities) {
            switch(projectAbility) {
                case 'narrative_shift': // Brand Repositioning: BX random perf 2-6
                    unitPerfs.forEach(u => {
                        if (u.tribe === 'BRAND_EXPERIENCE') {
                            u.calcPerf = Math.floor(Math.random() * 5) + 2; // 2-6
                            abilityLog.push(`🎭 ${u.name} perf random: ${u.calcPerf}`);
                        }
                    });
                    break;

                case 'conversion_focus': // Sales Enablement: GTM +2
                    unitPerfs.forEach(u => {
                        if (u.tribe === 'GO_TO_MARKET') {
                            u.calcPerf += 2;
                            abilityLog.push(`📈 ${u.name} +2 (GTM focus)`);
                        }
                    });
                    break;

                case 'high_volume': // Marketing Campaign: perf ≤3 count x2
                    unitPerfs.forEach(u => {
                        if (u.calcPerf <= 3) {
                            u.calcPerf *= 2;
                            abilityLog.push(`📢 ${u.name} x2 (high volume)`);
                        }
                    });
                    break;

                case 'cross_functional': // Digital Transformation: +1 per CC
                    const ccBonus = numCCs;
                    abilityLog.push(`🔀 +${ccBonus} totale (${numCCs} CC diversi)`);
                    break;
            }
        }

        // ========== UNIT ABILITIES ==========
        const noRandomEffects = projectAbility === 'risk_control';

        // Count units by tribe for synergy calculations
        const countByTribe = {};
        unitPerfs.forEach(u => {
            countByTribe[u.tribe] = (countByTribe[u.tribe] || 0) + 1;
        });

        // Check for GTM protection abilities
        const hasProtectBest = activeAbilities.includes('protect_best_from_client');
        const hasReduceClient = activeAbilities.includes('reduce_client_effect');

        // Check for data buff amplifier
        const hasDataBuffAmplifier = activeAbilities.includes('data_buff_amplifier');
        const hasDoubleDataBuffs = activeAbilities.includes('double_data_buffs');

        // Track buff multiplier for DATA abilities
        let dataBuffMultiplier = 1;
        if (hasDataBuffAmplifier) dataBuffMultiplier += 0.5;
        if (hasDoubleDataBuffs) dataBuffMultiplier *= 2;

        // Check for BX double random
        const hasBxDoubleRandom = activeAbilities.includes('bx_double_random');
        const hasBxRerollAll = activeAbilities.includes('bx_reroll_all');

        // Check for low perf double
        const hasLowPerfDouble = activeAbilities.includes('low_perf_double');

        // Check for always contributes
        const alwaysContributesUnits = unitPerfs.filter(u => u.ability === 'always_contributes').map(u => u.id);

        if (!ignoreAllAbilities) {
            allUnits.forEach(unit => {
                if (!unit.ability || unit.abilityDisabled) return;

                const unitPerf = unitPerfs.find(u => u.id === unit.id);
                if (!unitPerf) return;

                switch(unit.ability) {
                    // ===== CONSULTING =====
                    case 'battlecry_consulting_synergy':
                        if (countByTribe['CONSULTING'] >= 2) {
                            unitPerf.calcPerf += 1;
                            abilityLog.push(`💼 ${unit.name} +1 (synergy CONSULTING)`);
                        }
                        break;

                    case 'start_self_boost':
                        unitPerf.calcPerf += 1;
                        abilityLog.push(`📈 ${unit.name} +1 (self boost)`);
                        break;

                    case 'aura_consulting':
                        unitPerfs.forEach(u => {
                            if (u.tribe === 'CONSULTING' && u.id !== unit.id) {
                                u.calcPerf += 1;
                                abilityLog.push(`🔵 ${u.name} +1 (aura Consulting)`);
                            }
                        });
                        break;

                    case 'start_consulting_boost':
                        unitPerfs.forEach(u => {
                            if (u.tribe === 'CONSULTING') {
                                u.calcPerf += 2;
                                abilityLog.push(`💼 ${u.name} +2 (Principal)`);
                            }
                        });
                        break;

                    // ===== DATA & ANALYTICS =====
                    case 'end_random_boost':
                    case 'battlecry_random_boost':
                        if (!noRandomEffects) {
                            const others = unitPerfs.filter(u => u.id !== unit.id);
                            if (others.length > 0) {
                                const target = others[Math.floor(Math.random() * others.length)];
                                const bonus = Math.ceil(1 * dataBuffMultiplier);
                                target.calcPerf += bonus;
                                abilityLog.push(`📊 ${target.name} +${bonus} (DATA buff)`);
                            }
                        }
                        break;

                    case 'aura_all':
                        unitPerfs.forEach(u => {
                            if (u.id !== unit.id) {
                                const bonus = Math.ceil(1 * dataBuffMultiplier);
                                u.calcPerf += bonus;
                            }
                        });
                        abilityLog.push(`📊 Tutti +${Math.ceil(1 * dataBuffMultiplier)} (Data Scientist)`);
                        break;

                    case 'start_all_boost':
                        unitPerfs.forEach(u => {
                            const bonus = Math.ceil(1 * dataBuffMultiplier);
                            u.calcPerf += bonus;
                        });
                        abilityLog.push(`📊 Tutti +${Math.ceil(1 * dataBuffMultiplier)} (Sr Data Scientist)`);
                        break;

                    // ===== MARKETING =====
                    case 'battlecry_marketing_synergy':
                        if (countByTribe['MARKETING_MEDIA'] >= 2) {
                            unitPerf.calcPerf += 1;
                            abilityLog.push(`📢 ${unit.name} +1 (synergy Marketing)`);
                        }
                        break;

                    case 'aura_marketing':
                        unitPerfs.forEach(u => {
                            if (u.tribe === 'MARKETING_MEDIA') {
                                u.calcPerf += 1;
                                abilityLog.push(`📢 ${u.name} +1 (aura Marketing)`);
                            }
                        });
                        break;

                    case 'start_marketing_boost':
                        unitPerfs.forEach(u => {
                            if (u.tribe === 'MARKETING_MEDIA') {
                                u.calcPerf += 2;
                                abilityLog.push(`📢 ${u.name} +2 (Marketing Manager)`);
                            }
                        });
                        break;

                    // ===== BRAND EXPERIENCE =====
                    case 'start_random_self_boost':
                        if (!noRandomEffects) {
                            let bonus = Math.random() < 0.5 ? 1 : 2;
                            if (hasBxDoubleRandom) {
                                const bonus2 = Math.random() < 0.5 ? 1 : 2;
                                bonus = Math.max(bonus, bonus2);
                            }
                            unitPerf.calcPerf += bonus;
                            abilityLog.push(`🎨 ${unit.name} +${bonus} (random)`);
                        }
                        break;

                    case 'battlecry_reroll':
                        if (!noRandomEffects) {
                            let newPerf = Math.floor(Math.random() * 3) + 2; // 2-4
                            if (hasBxDoubleRandom) {
                                const newPerf2 = Math.floor(Math.random() * 3) + 2;
                                newPerf = Math.max(newPerf, newPerf2);
                            }
                            unitPerf.calcPerf = newPerf;
                            abilityLog.push(`🎨 ${unit.name} reroll: ${newPerf}`);
                        }
                        break;

                    case 'copy_random_perf':
                        if (!noRandomEffects) {
                            const others = unitPerfs.filter(u => u.id !== unit.id);
                            if (others.length > 0) {
                                let target = others[Math.floor(Math.random() * others.length)];
                                if (hasBxDoubleRandom) {
                                    const target2 = others[Math.floor(Math.random() * others.length)];
                                    if (target2.calcPerf > target.calcPerf) target = target2;
                                }
                                unitPerf.calcPerf = target.calcPerf;
                                abilityLog.push(`🎨 ${unit.name} copia ${target.name}: ${target.calcPerf}`);
                            }
                        }
                        break;

                    case 'end_random_self_boost':
                        if (!noRandomEffects) {
                            let bonus = 1;
                            if (hasBxDoubleRandom && Math.random() < 0.5) bonus = 2;
                            unitPerf.calcPerf += bonus;
                            abilityLog.push(`🎨 ${unit.name} +${bonus} (random end)`);
                        }
                        break;

                    // ===== TECH =====
                    case 'tech_synergy_self':
                        const otherTech = (countByTribe['TECH'] || 0) - 1;
                        if (otherTech > 0) {
                            unitPerf.calcPerf += otherTech;
                            abilityLog.push(`💻 ${unit.name} +${otherTech} (TECH synergy)`);
                        }
                        break;

                    case 'battlecry_tech_threshold':
                        if ((countByTribe['TECH'] || 0) >= 2) {
                            unitPerf.calcPerf += 1;
                            abilityLog.push(`💻 ${unit.name} +1 (2+ TECH)`);
                        }
                        break;

                    case 'aura_tech':
                        unitPerfs.forEach(u => {
                            if (u.tribe === 'TECH') {
                                u.calcPerf += 1;
                                abilityLog.push(`💻 ${u.name} +1 (aura Tech)`);
                            }
                        });
                        break;

                    case 'start_tech_count_boost':
                        const techCount = countByTribe['TECH'] || 0;
                        unitPerf.calcPerf += techCount;
                        abilityLog.push(`💻 ${unit.name} +${techCount} (per TECH)`);
                        break;

                    case 'tech_threshold_boost':
                        if ((countByTribe['TECH'] || 0) >= 3) {
                            unitPerfs.forEach(u => {
                                if (u.tribe === 'TECH') {
                                    u.calcPerf += 2;
                                    abilityLog.push(`💻 ${u.name} +2 (Tech Lead 3+)`);
                                }
                            });
                        }
                        break;

                    case 'start_tech_double_count':
                        const techCount2 = countByTribe['TECH'] || 0;
                        unitPerf.calcPerf += techCount2;
                        abilityLog.push(`💻 ${unit.name} +${techCount2} (Architect)`);
                        break;

                    // ===== LEGENDARY =====
                    case 'top2_boost':
                        abilityLog.push(`🎯 ${unit.name}: Solo top 2 contano (+3)`);
                        break;

                    case 'consulting_boost':
                        unitPerfs.forEach(u => {
                            if (u.tribe === 'CONSULTING') {
                                u.calcPerf += 2;
                                abilityLog.push(`📈 ${u.name} +2 (Marco Chicken)`);
                            }
                        });
                        break;

                    case 'double_buffs':
                        if (projectAbility === 'insight_driven') {
                            unitPerfs.forEach(u => {
                                if (u.tribe === 'DATA_ANALYTICS' && u.id !== unit.id) {
                                    const bonus = Math.floor(u.calcPerf * 0.5);
                                    u.calcPerf += bonus;
                                    abilityLog.push(`📊 ${u.name} +${bonus} (buff x2)`);
                                }
                            });
                        }
                        break;

                    case 'data_random_boost':
                        if (!noRandomEffects) {
                            const dataUnits = unitPerfs.filter(u => u.tribe === 'DATA_ANALYTICS');
                            const otherUnits = unitPerfs.filter(u => u.tribe !== 'DATA_ANALYTICS');
                            dataUnits.forEach(() => {
                                if (otherUnits.length > 0) {
                                    const target = otherUnits[Math.floor(Math.random() * otherUnits.length)];
                                    target.calcPerf += 1;
                                    abilityLog.push(`🎲 ${target.name} +1 (Max Trottamelier)`);
                                }
                            });
                        }
                        break;

                    case 'marketing_double':
                        unitPerfs.forEach(u => {
                            if (u.tribe === 'MARKETING_MEDIA') {
                                u.calcPerf *= 2;
                                abilityLog.push(`📢 ${u.name} x2 (Rocknrolliale)`);
                            }
                        });
                        break;

                    case 'bx_reroll':
                        if (!noRandomEffects) {
                            unitPerfs.forEach(u => {
                                if (u.tribe === 'BRAND_EXPERIENCE') {
                                    const bonus = Math.ceil(u.calcPerf * 0.2);
                                    u.calcPerf += bonus;
                                    abilityLog.push(`🎨 ${u.name} +${bonus} (Jan the Kind)`);
                                }
                            });
                        }
                        break;

                    case 'gtm_vs_data':
                        unitPerfs.forEach(u => {
                            if (u.tribe === 'DATA_ANALYTICS') {
                                u.abilityDisabled = true;
                            }
                            if (u.tribe === 'GO_TO_MARKET') {
                                u.calcPerf += 2;
                                abilityLog.push(`🚀 ${u.name} +2 (Oscar Vulcania)`);
                            }
                        });
                        break;

                    case 'diversity_team':
                        const teamBonus = numCCs;
                        unitPerfs.forEach(u => {
                            u.calcPerf += teamBonus;
                        });
                        abilityLog.push(`🦆 Tutti +${teamBonus} (Ducchio - ${numCCs} CC)`);
                        break;

                    case 'diversity_self':
                        const selfBonus = numCCs * 2;
                        unitPerf.calcPerf += selfBonus;
                        abilityLog.push(`🤖 Dru.so +${selfBonus} (${numCCs} CC)`);
                        break;
                }
            });

            // Apply low perf double (Senior Marketer)
            if (hasLowPerfDouble) {
                unitPerfs.forEach(u => {
                    if (u.performance <= 3) { // Original performance
                        u.calcPerf *= 2;
                        abilityLog.push(`📢 ${u.name} x2 (Sr Marketer: perf ≤3)`);
                    }
                });
            }
        } else {
            abilityLog.push(`⚡ Enrico Chaos: Tutte le abilità ignorate!`);
        }

        // ========== APPLY PROJECT FILTERING ABILITIES ==========
        let contributingUnits = [...unitPerfs];

        // Units with "always_contributes" ability bypass filtering
        const alwaysContributes = unitPerfs.filter(u => u.ability === 'always_contributes');

        if (!ignoreAllAbilities) {
            switch(projectAbility) {
                case 'only_top_performers': // Strategic Transformation: only top 3
                    contributingUnits.sort((a, b) => b.calcPerf - a.calcPerf);
                    let top3 = contributingUnits.slice(0, 3);
                    // Add always_contributes units if not already included
                    alwaysContributes.forEach(ac => {
                        if (!top3.find(u => u.id === ac.id)) {
                            top3.push(ac);
                            abilityLog.push(`👔 ${ac.name} contribuisce sempre!`);
                        }
                    });
                    contributingUnits = top3;
                    abilityLog.push(`🎯 Progetto: Solo top 3 contano`);
                    break;

                case 'quality_focus': // Customer Care: lowest = 0
                    // Don't set lowest to 0 if it has always_contributes
                    contributingUnits.sort((a, b) => a.calcPerf - b.calcPerf);
                    const lowest = contributingUnits.find(u => u.ability !== 'always_contributes');
                    if (lowest) {
                        lowest.calcPerf = 0;
                        abilityLog.push(`📉 ${lowest.name} = 0 (quality focus)`);
                    }
                    break;

                case 'time_to_market': // E-commerce: only first 4
                    let first4 = contributingUnits.slice(0, 4);
                    // Add always_contributes units if not already included
                    alwaysContributes.forEach(ac => {
                        if (!first4.find(u => u.id === ac.id)) {
                            first4.push(ac);
                            abilityLog.push(`👔 ${ac.name} contribuisce sempre!`);
                        }
                    });
                    contributingUnits = first4;
                    abilityLog.push(`⏱️ Progetto: Solo primi 4 contano`);
                    break;
            }
        }

        // Handle Buca Losco's top2_boost ability
        let finalPerf = 0;
        const hasBucaLosco = !ignoreAllAbilities && activeAbilities.includes('top2_boost');

        if (hasBucaLosco) {
            contributingUnits.sort((a, b) => b.calcPerf - a.calcPerf);
            let top2 = contributingUnits.slice(0, 2);
            // Add always_contributes units
            alwaysContributes.forEach(ac => {
                if (!top2.find(u => u.id === ac.id)) {
                    top2.push(ac);
                }
            });
            top2.slice(0, 2).forEach(u => u.calcPerf += 3); // +3 only to actual top 2
            finalPerf = top2.reduce((sum, u) => sum + u.calcPerf, 0);
            abilityLog.push(`🎯 Buca Losco Top 2: ${top2.slice(0, 2).map(u => u.name).join(', ')}`);
        } else {
            finalPerf = contributingUnits.reduce((sum, u) => sum + u.calcPerf, 0);
        }

        // Add synergy bonus (unless blocked by client effect)
        if (!skipSynergyBonus) {
            const synergyBonus = getSynergyBonus(allUnits);
            if (synergyBonus > 0) {
                abilityLog.push(`✨ Sinergia: +${synergyBonus}`);
                finalPerf += synergyBonus;
            }
        }

        // Add cross_functional bonus if applicable
        if (!ignoreAllAbilities && projectAbility === 'cross_functional') {
            finalPerf += numCCs;
        }

        // Calculate leader bonus (double points)
        let leaderBonus = 0;
        if (game.leader) {
            const leaderUnit = contributingUnits.find(u => u.id === game.leader.id);
            leaderBonus = leaderUnit ? leaderUnit.calcPerf : game.leader.performance;
        }

        let totalPerf = finalPerf + leaderBonus;

        // Update display
        document.getElementById('perf-base').textContent = finalPerf;
        document.getElementById('perf-leader').textContent = '+' + leaderBonus;
        document.getElementById('perf-total').textContent = '=' + totalPerf;
        document.getElementById('perf-required').textContent = game.project.requiredPerformance;

        log(`\n📊 RISULTATO:`, "info");
        log(`📋 ${game.project.name}`, "info");
        abilityLog.forEach(msg => log(msg, "info"));
        log(`Base: ${finalPerf}⭐`);
        log(`Bonus CP (x2): +${leaderBonus}⭐`);
        log(`TOTALE: ${totalPerf}⭐ vs ${game.project.requiredPerformance}⭐`);

        setTimeout(() => {
            if (totalPerf >= game.project.requiredPerformance) {
                showResult(true, totalPerf);
            } else {
                showResult(false, totalPerf);
            }
        }, 800);
    }

    function showResult(victory, achievedPerf) {
        const overlay = document.getElementById('overlay');
        overlay.style.display = 'flex';
        overlay.className = 'overlay ' + (victory ? 'victory' : 'defeat');

        const reward = victory ? calculateReward() : 0;

        document.getElementById('overlay-title').textContent = victory ? '🎉 PROGETTO COMPLETATO!' : '💀 PROGETTO FALLITO!';
        document.getElementById('overlay-message').textContent = victory
            ? `${game.project.name} completato con successo!`
            : `${game.project.name} fallito...`;

        document.getElementById('overlay-reward').innerHTML = victory
            ? `+${reward}k€ guadagnati!`
            : 'Nessun guadagno';

        document.getElementById('overlay-stats').innerHTML = `
            <div>Performance: ${achievedPerf}⭐ / ${game.project.requiredPerformance}⭐</div>
            <div style="margin-top:5px;">Progetto #${game.projectNum}</div>
        `;

        document.getElementById('btn-next').style.display = victory ? 'inline-block' : 'none';

        if (victory) {
            session.projectsCompleted++;
            session.moneyGenerated += reward;
            session.totalPerformance += achievedPerf;
            game.budget += reward;

            log(`🎉 VITTORIA! +${reward}k€`, "win");
        } else {
            session.totalPerformance += achievedPerf;
            game.gameOver = true;

            // Save to leaderboard
            saveToLeaderboard({
                name: session.playerName,
                sessionNum: session.sessionNum,
                moneyGenerated: session.moneyGenerated,
                projectsCompleted: session.projectsCompleted,
                totalPerformance: session.totalPerformance,
                date: new Date().toISOString()
            });

            log(`💀 Game Over! ${session.projectsCompleted} progetti completati`, "lose");
        }

        updateUI();
    }

    function nextProject() {
        document.getElementById('overlay').style.display = 'none';

        game.projectNum++;
        game.phase = 'staffing';

        // Return team to pool
        game.team.forEach(r => game.pool.push(r));
        game.team = [];

        // Return leader to pool
        if (game.leader) {
            game.pool.push(game.leader);
            game.leader = null;
        }

        generateProject();

        if (!game.hr.frozen) {
            refreshHR();
        } else {
            game.hr.frozen = false;
        }

        log(`\n📋 === PROGETTO #${game.projectNum} ===`, "info");
        log(`📋 ${game.project.name}`, "info");
        log(`💶 Cassa: ${game.budget}k€`);

        updateUI();
    }

    function backToMenu() {
        // Save session if game is over
        if (game.gameOver || session.projectsCompleted > 0) {
            if (!game.gameOver) {
                saveToLeaderboard({
                    name: session.playerName,
                    sessionNum: session.sessionNum,
                    moneyGenerated: session.moneyGenerated,
                    projectsCompleted: session.projectsCompleted,
                    totalPerformance: session.totalPerformance,
                    date: new Date().toISOString()
                });
            }
        }

        document.getElementById('overlay').style.display = 'none';
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('welcome-screen').style.display = 'flex';
        renderLeaderboard();
    }

    // ==================== UI ====================
    function log(msg, type = '') {
        logs.push({ msg, type });
        if (logs.length > 50) logs.shift();
        const logDiv = document.getElementById('log');
        logDiv.innerHTML = logs.map(l => `<div class="${l.type}">${l.msg}</div>`).join('');
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    // Card Preview Functions
    function showCardPreview(resource, event) {
        const preview = document.getElementById('card-preview');

        document.getElementById('preview-name').textContent = resource.name;
        document.getElementById('preview-tribe').textContent = resource.tribe.replace(/_/g, ' ');
        document.getElementById('preview-perf').textContent = resource.performance + '⭐';
        document.getElementById('preview-cost').textContent = resource.cost + 'k€';
        document.getElementById('preview-tier').textContent = 'Tier ' + resource.tier;

        const abilityDiv = document.getElementById('preview-ability');
        if (resource.ability && resource.abilityDesc) {
            abilityDiv.textContent = resource.abilityDesc;
            abilityDiv.style.display = 'block';
        } else {
            abilityDiv.style.display = 'none';
        }

        // Set legendary class
        preview.classList.toggle('legendary', resource.tier === 5);

        // Position the preview
        const rect = event.target.closest('.card').getBoundingClientRect();
        let left = rect.right + 10;
        let top = rect.top;

        // Keep within viewport
        if (left + 200 > window.innerWidth) {
            left = rect.left - 200;
        }
        if (top + 200 > window.innerHeight) {
            top = window.innerHeight - 220;
        }

        preview.style.left = left + 'px';
        preview.style.top = top + 'px';
        preview.classList.add('visible');
    }

    function hideCardPreview() {
        document.getElementById('card-preview').classList.remove('visible');
    }

    function createCardElement(resource, onClick, showCost = false, isLeader = false) {
        const div = document.createElement('div');
        div.className = `card tribe-${resource.tribe}`;
        if (isLeader) div.classList.add('leader');
        if (resource.tier === 5) div.classList.add('legendary');
        if (sellMode) div.style.border = '3px solid #e74c3c';

        const tribeDisplay = resource.tribe.replace(/_/g, ' ');
        const abilityHtml = resource.ability ?
            `<div class="card-ability" title="${resource.abilityDesc}">${resource.abilityDesc}</div>` : '';
        const abilityIcon = resource.ability ? '<span class="ability-icon">✨</span>' : '';

        div.innerHTML = `
            <div class="card-name">${resource.name}</div>
            <div class="card-role">${tribeDisplay}</div>
            <div class="card-performance">${resource.performance}<span>⭐</span></div>
            ${abilityHtml}
            ${showCost ? `<div class="card-cost">${resource.cost}k€</div>` : ''}
            ${abilityIcon}
        `;

        // Hover preview
        div.addEventListener('mouseenter', (e) => showCardPreview(resource, e));
        div.addEventListener('mouseleave', hideCardPreview);

        if (onClick) div.onclick = onClick;
        return div;
    }

    function updateUI() {
        // Session stats
        document.getElementById('stat-player').textContent = session.playerName || '-';
        document.getElementById('stat-money').textContent = `${session.moneyGenerated}k€`;
        document.getElementById('stat-projects').textContent = session.projectsCompleted;
        document.getElementById('stat-perf').textContent = `${session.totalPerformance}⭐`;

        // Header
        document.getElementById('project-num').textContent = game.projectNum;
        document.getElementById('budget').textContent = game.budget;

        const phaseBadge = document.getElementById('phase-badge');
        phaseBadge.textContent = game.phase === 'staffing' ? 'STAFFING' : 'DELIVERY';
        phaseBadge.className = `phase-badge phase-${game.phase}`;

        // HR Panel
        document.getElementById('hr-panel').style.display = game.phase === 'staffing' ? 'block' : 'none';

        const freezeBtn = document.getElementById('btn-freeze');
        freezeBtn.textContent = game.hr.frozen ? '🔥 Unfreeze' : '❄️ Freeze';
        freezeBtn.classList.toggle('frozen', game.hr.frozen);
        document.getElementById('btn-refresh').disabled = game.budget < 1;

        // HR Cards
        const hrDiv = document.getElementById('hr-cards');
        hrDiv.innerHTML = '';
        game.hr.cards.forEach((res, i) => {
            const canAfford = game.budget >= res.cost && game.pool.length < 8;
            const el = createCardElement(res, canAfford ? () => hireResource(i) : null, true);
            if (!canAfford) el.style.opacity = '0.5';
            hrDiv.appendChild(el);
        });

        // Project Card (separate from client)
        const projectDiv = document.getElementById('project-card-area');
        projectDiv.innerHTML = '';
        const synergies = game.project.synergy.map(s => s.replace(/_/g, ' ')).join(', ');

        const projectCard = document.createElement('div');
        projectCard.className = 'mini-card';

        if (game.project.revealed) {
            const reward = calculateReward();
            projectCard.innerHTML = `
                <div class="name">${game.project.name}</div>
                <div class="desc">${game.project.abilityDesc}</div>
                <div class="perf">${game.project.requiredPerformance}⭐</div>
                <div class="details">Staff max: ${game.project.staffLimit}</div>
                <div class="synergy">Sinergie: ${synergies}</div>
                <div style="margin-top:4px; font-size:10px; color:#2ecc71;">Reward: ${reward}k€</div>
            `;
        } else {
            projectCard.innerHTML = `
                <div class="name">${game.project.name}</div>
                <div class="desc">${game.project.abilityDesc}</div>
                <div class="perf" style="color:#666;">?⭐</div>
                <div class="details">Staff max: ${game.project.staffLimit}</div>
                <div class="synergy">Sinergie: ${synergies}</div>
            `;
        }
        projectDiv.appendChild(projectCard);

        // Client Card (hidden until delivery)
        const clientDiv = document.getElementById('client-card-area');
        clientDiv.innerHTML = '';
        const clientCard = document.createElement('div');
        clientCard.className = 'mini-card' + (game.phase === 'delivery' ? '' : ' hidden');

        if (game.phase === 'delivery') {
            // Show client details in delivery
            clientCard.innerHTML = `
                <div class="name" style="color:#e74c3c;">${game.client.name}</div>
                <div class="client-effect">${game.client.effectDesc}</div>
                <div class="perf">${game.client.baseStrength}⭐</div>
                <div class="multiplier">x${game.client.moneyMultiplier} reward</div>
            `;
        } else {
            // Client hidden during staffing
            clientCard.innerHTML = `
                <div class="name" style="color:#666;">???</div>
                <div class="desc" style="color:#444;">Cliente sconosciuto</div>
                <div class="perf" style="color:#444;">?⭐</div>
                <div class="details" style="color:#444;">Svelato in Delivery</div>
            `;
        }
        clientDiv.appendChild(clientCard);

        // Performance Summary
        document.getElementById('perf-summary').style.display = game.phase === 'delivery' ? 'block' : 'none';

        // Buttons
        document.getElementById('btn-delivery').style.display = game.phase === 'staffing' ? 'inline-block' : 'none';
        document.getElementById('btn-calculate').style.display = game.phase === 'delivery' ? 'inline-block' : 'none';
        document.getElementById('btn-sell').style.display = game.phase === 'staffing' ? 'inline-block' : 'none';

        // User can go to delivery anytime
        document.getElementById('btn-delivery').disabled = false;

        // Leader Section
        const leaderDiv = document.getElementById('leader-area');
        leaderDiv.innerHTML = '';
        if (game.leader) {
            const el = createCardElement(game.leader, () => setAsLeader('leader', 0), false, true);
            leaderDiv.appendChild(el);
        } else {
            const slot = document.createElement('div');
            slot.className = 'empty-slot leader-slot';
            slot.innerHTML = '👑<br>Trascina qui<br>dal Pool';
            leaderDiv.appendChild(slot);
        }

        // Team
        document.getElementById('team-count').textContent = game.team.length;
        document.getElementById('team-required').textContent = game.requiredStaff;

        const teamDiv = document.getElementById('team-cards');
        teamDiv.innerHTML = '';
        for (let i = 0; i < game.requiredStaff; i++) {
            if (i < game.team.length) {
                const res = game.team[i];
                const el = createCardElement(res, game.phase === 'staffing' ? () => unstaffResource(i) : null);

                // Add leader button
                if (game.phase === 'staffing') {
                    const crownBtn = document.createElement('button');
                    crownBtn.textContent = '👑';
                    crownBtn.title = 'Rendi Capo Progetto';
                    crownBtn.style.cssText = 'position:absolute;top:-8px;left:-5px;font-size:14px;border:none;background:rgba(0,0,0,0.5);border-radius:50%;width:24px;height:24px;cursor:pointer;';
                    crownBtn.onclick = (e) => { e.stopPropagation(); setAsLeader('team', i); };
                    el.appendChild(crownBtn);
                }

                teamDiv.appendChild(el);
            } else {
                const slot = document.createElement('div');
                slot.className = 'empty-slot required';
                slot.innerHTML = `Slot ${i + 1}`;
                teamDiv.appendChild(slot);
            }
        }

        // Pool
        document.getElementById('pool-count').textContent = game.pool.length;
        const poolDiv = document.getElementById('pool-cards');
        poolDiv.innerHTML = '';
        game.pool.forEach((res, i) => {
            const el = createCardElement(res, () => staffFromPool(i));

            // Add buttons for staffing during staffing phase
            if (game.phase === 'staffing') {
                // Crown button to make leader
                const crownBtn = document.createElement('button');
                crownBtn.textContent = '👑';
                crownBtn.title = 'Rendi Capo Progetto';
                crownBtn.style.cssText = 'position:absolute;top:-8px;left:-5px;font-size:14px;border:none;background:rgba(241,196,15,0.8);border-radius:50%;width:24px;height:24px;cursor:pointer;';
                crownBtn.onclick = (e) => { e.stopPropagation(); setAsLeader('pool', i); };
                el.appendChild(crownBtn);
            }

            poolDiv.appendChild(el);
        });

        if (game.pool.length === 0) {
            poolDiv.innerHTML = '<div class="empty-slot">Pool vuoto<br>Assumi da HR</div>';
        }
    }

    // Enable start button when both fields have content
    document.getElementById('input-nome').addEventListener('input', checkStartButton);
    document.getElementById('input-cognome').addEventListener('input', checkStartButton);

    function checkStartButton() {
        const nome = document.getElementById('input-nome').value.trim();
        const cognome = document.getElementById('input-cognome').value.trim();
        document.getElementById('btn-start').disabled = !nome || !cognome;
    }

    // Init
    checkStartButton();
    renderLeaderboard();
    </script>
</body>
